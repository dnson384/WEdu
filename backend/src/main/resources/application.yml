spring:
  application:
    name: Backend

  servlet:
    multipart:
      max-file-size: "50MB"
      max-request-size: "65MB"

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  mongodb:
    uri: "mongodb+srv://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@cluster0.96svcb8.mongodb.net/?appName=Cluster0"
    database: "test001"

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_APP_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  static:
    dir: "./static/"
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-expiration-ms: 300000
    refresh-expiration-ms: 604800000
  frontend:
    url: ${FRONTEND_URL}

aws:
  accessKey: "${AWS_ACCESS_KEY_ID}"
  secretKey: "${AWS_SECRET_ACCESS_KEY}"
  region: "ap-southeast-2"
  bucketName: "fckedu-backend-storage-static"

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    model: deepseek-flash
    timeout-seconds: 30

telegram:
  bot:
    question:
      token: ${TELEGRAM_QUESTION_BOT_TOKEN}
    s3:
      token: ${TELEGRAM_S3_BOT_TOKEN}
  chat:
    id: ${TELEGRAM_CHAT_ID}

export:
  url: ${EXPRESS_EXPORTER_URL}