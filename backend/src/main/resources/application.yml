spring:
  application:
    name: Backend

  servlet:
    multipart:
      max-file-size: "50MB"
      max-request-size: "65MB"

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  mongodb:
    uri: "mongodb+srv://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@cluster0.96svcb8.mongodb.net/?appName=Cluster0"
    database: "test001"

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/auth/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_APP_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
          auth: true
          starttls:
            enable: true

app:
  static:
    dir: "./static/"
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-expiration-ms: 300000
    refresh-expiration-ms: 604800000
  frontend:
    url: ${FRONTEND_URL}

aws:
  accessKey: "${AWS_ACCESS_KEY_ID}"
  secretKey: "${AWS_SECRET_ACCESS_KEY}"
  region: "ap-southeast-2"
  bucketName: "fckedu-backend-storage-static"

ai:
  pricing:
    version: deepseek-2026-11-01-peak-usd
    models:
      deepseek-flash:
        input-cache-hit: 0.006
        input-cache-miss: 0.3
        output: 1.2
      deepseek-v4-pro:
        input-cache-hit: 0.044
        input-cache-miss: 1.32
        output: 3.96
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    model: deepseek-flash
    timeout-seconds: 30

telegram:
  bot:
    question:
      token: ${TELEGRAM_QUESTION_BOT_TOKEN}
    s3:
      token: ${TELEGRAM_S3_BOT_TOKEN}
  chat:
    id: ${TELEGRAM_CHAT_ID}

export:
  url: ${EXPRESS_EXPORTER_URL}

payment:
  refund:
    enabled: ${REFUND_ENABLED}
  vnpay:
    enabled: ${VNPAY_ENABLED}
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    payment-url: ${VNPAY_PAYMENT_URL}
    query-url: ${VNPAY_QUERY_URL}
    return-url: ${VNPAY_RETURN_URL}
    bank-code: ${VNPAY_BANK_CODE:}
    server-ip: ${VNPAY_SERVER_IP:127.0.0.1}

# Independent server-only secret, at least 32 characters.
auth:
  otp-secret: ${OTP_SECRET}
  migration:
    enabled: ${AUTH_MIGRATION_ENABLED:false}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE}
